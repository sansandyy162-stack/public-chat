<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <meta
    name="theme-color"
    content="#075e54"
  >

  <title>Private Chat Realtime</title>

  <link
    rel="stylesheet"
    href="style.css"
  >
</head>

<body>

  <!-- =========================
       AUTH
  ========================== -->

  <section
    id="loginScreen"
    class="login-screen"
  >

    <div class="login-card">

      <div class="logo">
        💬
      </div>

      <h1>
        Private Chat
      </h1>

      <div
        id="loginForm"
        class="auth-form"
      >

        <h2>Masuk</h2>

        <p>
          Login untuk membuka chat.
        </p>

        <input
          id="loginEmail"
          type="email"
          placeholder="Email"
          autocomplete="email"
        >

        <input
          id="loginPassword"
          type="password"
          placeholder="Password"
          autocomplete="current-password"
        >

        <button
          id="loginButton"
          type="button"
        >
          Masuk
        </button>

        <div
          id="loginStatus"
          class="small-status"
        ></div>

        <div class="auth-switch">

          Belum punya akun?

          <button
            id="showRegisterButton"
            class="link-button"
            type="button"
          >
            Daftar
          </button>

        </div>

      </div>


      <!-- REGISTER -->

      <div
        id="registerForm"
        class="auth-form hidden"
      >

        <h2>
          Buat Akun
        </h2>

        <p>
          Akun bisa digunakan
          di perangkat lain.
        </p>

        <input
          id="registerName"
          type="text"
          placeholder="Nama tampilan"
          maxlength="30"
        >

        <input
          id="registerEmail"
          type="email"
          placeholder="Email"
          autocomplete="email"
        >

        <input
          id="registerPassword"
          type="password"
          placeholder="Password minimal 6 karakter"
          autocomplete="new-password"
        >

        <input
          id="registerPassword2"
          type="password"
          placeholder="Ulangi password"
          autocomplete="new-password"
        >

        <button
          id="registerButton"
          type="button"
        >
          Daftar
        </button>

        <div
          id="registerStatus"
          class="small-status"
        ></div>

        <div class="auth-switch">

          Sudah punya akun?

          <button
            id="showLoginButton"
            class="link-button"
            type="button"
          >
            Masuk
          </button>

        </div>

      </div>

    </div>

  </section>


  <!-- =========================
       APP
  ========================== -->

  <section
    id="appScreen"
    class="app-screen hidden"
  >

    <aside class="sidebar">

      <header class="sidebar-header">

        <div>

          <div class="app-title">
            ⚡ Private Chat
          </div>

          <div
            id="myName"
            class="my-name"
          ></div>

          <div
            id="myEmail"
            class="my-username"
          ></div>

        </div>

        <button
          id="logoutButton"
          class="icon-button"
          type="button"
        >
          Keluar
        </button>

      </header>


      <div class="user-list-title">
        Pilih pengguna
      </div>


      <div
        id="userList"
        class="user-list"
      >
        <div class="center-info">
          Memuat pengguna...
        </div>
      </div>

    </aside>


    <!-- CHAT -->

    <main class="chat-panel">

      <div
        id="emptyChat"
        class="empty-chat"
      >

        <div class="empty-icon">
          ⚡
        </div>

        <h2>
          Realtime Chat
        </h2>

        <p>
          Pilih pengguna untuk
          mulai percakapan.
        </p>

      </div>


      <div
        id="conversation"
        class="conversation hidden"
      >

        <header class="chat-header">

          <button
            id="backButton"
            class="back-button"
            type="button"
          >
            ←
          </button>

          <div class="partner-avatar">

            <span id="partnerInitial">
              ?
            </span>

          </div>

          <div class="partner-info">

            <div
              id="partnerName"
              class="partner-name"
            ></div>

            <div
              id="partnerStatus"
              class="partner-status"
            >
              -
            </div>

          </div>

        </header>


        <div
          id="messages"
          class="messages"
        ></div>


        <!-- REPLY -->

        <div
          id="activeReply"
          class="active-reply hidden"
        >

          <div class="active-reply-content">

            <div
              id="activeReplyTitle"
              class="active-reply-title"
            >
              Reply
            </div>

            <div
              id="activeReplyText"
              class="active-reply-text"
            ></div>

          </div>

          <button
            id="cancelReplyButton"
            class="cancel-reply"
            type="button"
          >
            ×
          </button>

        </div>


        <!-- COMPOSER -->

        <footer class="composer">

          <input
            id="messageInput"
            type="text"
            maxlength="1000"
            placeholder="Ketik pesan..."
            autocomplete="off"
          >

          <button
            id="sendButton"
            type="button"
          >
            ➤
          </button>

        </footer>

      </div>

    </main>

  </section>


  <!-- SUPABASE JS -->

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script src="app.js"></script>

</body>

</html>
