<!DOCTYPE html>
<html lang="id">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <meta
    name="theme-color"
    content="#075e54"
  >

  <title>Private Chat</title>

  <link
    rel="stylesheet"
    href="style.css"
  >

</head>


<body>


  <!-- =====================================
       AUTH
  ====================================== -->

  <section
    id="loginScreen"
    class="login-screen"
  >

    <div class="login-card">

      <div class="logo">
        💬
      </div>

      <h1>
        Private Chat
      </h1>


      <!-- LOGIN FORM -->

      <div
        id="loginForm"
        class="auth-form"
      >

        <h2>
          Masuk
        </h2>

        <p>
          Masuk untuk melanjutkan chat.
        </p>


        <input
          id="loginUsername"
          type="text"
          placeholder="Username"
          maxlength="30"
          autocomplete="username"
        >


        <input
          id="loginPassword"
          type="password"
          placeholder="Password"
          maxlength="100"
          autocomplete="current-password"
        >


        <button
          id="loginButton"
          type="button"
        >
          Masuk
        </button>


        <div
          id="loginStatus"
          class="small-status"
        ></div>


        <div class="auth-switch">

          Belum punya akun?

          <button
            id="showRegisterButton"
            type="button"
            class="link-button"
          >
            Daftar
          </button>

        </div>

      </div>


      <!-- REGISTER FORM -->

      <div
        id="registerForm"
        class="auth-form hidden"
      >

        <h2>
          Buat Akun
        </h2>

        <p>
          Akun ini bisa digunakan
          di perangkat lain.
        </p>


        <input
          id="registerName"
          type="text"
          placeholder="Nama tampilan"
          maxlength="30"
          autocomplete="name"
        >


        <input
          id="registerUsername"
          type="text"
          placeholder="Username"
          maxlength="30"
          autocomplete="username"
        >


        <input
          id="registerPassword"
          type="password"
          placeholder="Password minimal 6 karakter"
          maxlength="100"
          autocomplete="new-password"
        >


        <input
          id="registerPassword2"
          type="password"
          placeholder="Ulangi password"
          maxlength="100"
          autocomplete="new-password"
        >


        <button
          id="registerButton"
          type="button"
        >
          Daftar
        </button>


        <div
          id="registerStatus"
          class="small-status"
        ></div>


        <div class="auth-switch">

          Sudah punya akun?

          <button
            id="showLoginButton"
            type="button"
            class="link-button"
          >
            Masuk
          </button>

        </div>

      </div>

    </div>

  </section>


  <!-- =====================================
       APP
  ====================================== -->

  <section
    id="appScreen"
    class="app-screen hidden"
  >


    <!-- SIDEBAR -->

    <aside
      id="sidebar"
      class="sidebar"
    >

      <header class="sidebar-header">

        <div>

          <div class="app-title">
            💬 Private Chat
          </div>

          <div
            id="myName"
            class="my-name"
          ></div>

          <div
            id="myUsername"
            class="my-username"
          ></div>

        </div>


        <button
          id="logoutButton"
          class="icon-button"
          type="button"
        >
          Keluar
        </button>

      </header>


      <div class="user-list-title">
        Pilih pengguna
      </div>


      <div
        id="userList"
        class="user-list"
      >

        <div class="center-info">
          Memuat user...
        </div>

      </div>

    </aside>


    <!-- CHAT PANEL -->

    <main
      id="chatPanel"
      class="chat-panel"
    >


      <!-- EMPTY -->

      <div
        id="emptyChat"
        class="empty-chat"
      >

        <div class="empty-icon">
          💬
        </div>

        <h2>
          Private Chat
        </h2>

        <p>
          Pilih pengguna untuk
          mulai percakapan.
        </p>

      </div>


      <!-- CONVERSATION -->

      <div
        id="conversation"
        class="conversation hidden"
      >


        <!-- CHAT HEADER -->

        <header class="chat-header">

          <button
            id="backButton"
            class="back-button"
            type="button"
          >
            ←
          </button>


          <div class="partner-avatar">

            <span
              id="partnerInitial"
            >
              ?
            </span>

          </div>


          <div class="partner-info">

            <div
              id="partnerName"
              class="partner-name"
            ></div>

            <div
              id="partnerStatus"
              class="partner-status"
            >
              -
            </div>

          </div>

        </header>


        <!-- MESSAGES -->

        <div
          id="messages"
          class="messages"
        ></div>


        <!-- ACTIVE REPLY -->

        <div
          id="activeReply"
          class="active-reply hidden"
        >

          <div
            class="active-reply-content"
          >

            <div
              id="activeReplyTitle"
              class="active-reply-title"
            >
              Reply
            </div>

            <div
              id="activeReplyText"
              class="active-reply-text"
            ></div>

          </div>


          <button
            id="cancelReplyButton"
            class="cancel-reply"
            type="button"
          >
            ×
          </button>

        </div>


        <!-- COMPOSER -->

        <footer class="composer">

          <input
            id="messageInput"
            type="text"
            maxlength="1000"
            placeholder="Ketik pesan..."
            autocomplete="off"
          >


          <button
            id="sendButton"
            type="button"
          >
            ➤
          </button>

        </footer>

      </div>

    </main>

  </section>


  <script src="app.js"></script>

</body>

</html>
