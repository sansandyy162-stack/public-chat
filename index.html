<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <meta
    name="theme-color"
    content="#075e54"
  >

  <title>Private Chat</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- LOGIN -->
  <section id="loginScreen" class="login-screen">

    <div class="login-card">

      <div class="logo">💬</div>

      <h1>Private Chat</h1>

      <p>
        Masukkan nama kamu untuk mulai chat.
      </p>

      <input
        id="nameInput"
        type="text"
        placeholder="Nama kamu"
        maxlength="30"
        autocomplete="off"
      >

      <button
        id="loginButton"
        type="button"
      >
        Masuk
      </button>

      <div
        id="loginStatus"
        class="small-status"
      ></div>

    </div>

  </section>


  <!-- APP -->
  <section
    id="appScreen"
    class="app-screen hidden"
  >

    <!-- SIDEBAR / USER LIST -->
    <aside
      id="sidebar"
      class="sidebar"
    >

      <header class="sidebar-header">

        <div>
          <div class="app-title">
            💬 Private Chat
          </div>

          <div
            id="myName"
            class="my-name"
          ></div>
        </div>

        <button
          id="logoutButton"
          class="icon-button"
          type="button"
          title="Keluar"
        >
          Keluar
        </button>

      </header>


      <div class="user-list-title">
        Pilih pengguna
      </div>


      <div
        id="userList"
        class="user-list"
      >

        <div class="center-info">
          Memuat user...
        </div>

      </div>

    </aside>


    <!-- CHAT PANEL -->
    <main
      id="chatPanel"
      class="chat-panel"
    >

      <!-- EMPTY STATE -->

      <div
        id="emptyChat"
        class="empty-chat"
      >

        <div class="empty-icon">
          💬
        </div>

        <h2>Private Chat</h2>

        <p>
          Pilih pengguna untuk mulai percakapan.
        </p>

      </div>


      <!-- ACTIVE CONVERSATION -->

      <div
        id="conversation"
        class="conversation hidden"
      >

        <header class="chat-header">

          <button
            id="backButton"
            class="back-button"
            type="button"
          >
            ←
          </button>


          <div class="partner-avatar">
            <span id="partnerInitial">
              ?
            </span>
          </div>


          <div class="partner-info">

            <div
              id="partnerName"
              class="partner-name"
            ></div>

            <div
              id="partnerStatus"
              class="partner-status"
            >
              -
            </div>

          </div>

        </header>


        <div
          id="messages"
          class="messages"
        ></div>


        <footer class="composer">

          <input
            id="messageInput"
            type="text"
            maxlength="1000"
            placeholder="Ketik pesan..."
            autocomplete="off"
          >

          <button
            id="sendButton"
            type="button"
          >
            ➤
          </button>

        </footer>

      </div>

    </main>

  </section>


  <script src="app.js"></script>

</body>
</html>
